services:
  api:
    build:
      context: .
      target: api
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-20}
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      ollama:
        condition: service_started
  ui:
    build:
      context: .
      target: ui
    environment:
      API_URL: http://api:8000
      API_TIMEOUT: ${API_TIMEOUT:-30}
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
  ollama:
    image: ollama/ollama:0.6.2
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama:

